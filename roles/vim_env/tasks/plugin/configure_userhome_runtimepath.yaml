---
- name: create directory `~/.vim`
  # variable `target_user` must be defined in playbook
  ansible.builtin.file:
    path: "~{{target_user}}/.vim"
    owner: "{{target_user}}"
    group: "{{target_user}}"
    state: directory
- name: create directory `~/.vim/plugin`
  ansible.builtin.file:
    path: "~{{target_user}}/.vim/plugin"
    owner: "{{target_user}}"
    group: "{{target_user}}"
    state: directory
