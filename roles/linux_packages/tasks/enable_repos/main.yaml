---
- name: Enable repository in Debian family hosts
  ansible.builtin.include_tasks:
    # Variable `role_name` is automatically defined by ansible.
    # See 'Special Varialbles' page from official documents.
    file: "{{ role_dir }}/{{ role_name }}/tasks/enable_repos/debian.yaml"
  when: ansible_os_family == "Debian"

- name: Enable repository in Red hat family hosts
  ansible.builtin.include_tasks:
    file: "{{ role_dir }}/{{role_name }}/tasks/enable_repos/redhat.yaml"
  when: ansible_os_family == "RedHat"


