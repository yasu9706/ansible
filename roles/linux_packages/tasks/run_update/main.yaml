---
- name: Include Ubuntu-specific tasks if the OS family is Debian
  ansible.builtin.include_tasks:
    # Variable `role_name` is automatically defined by ansible.
    # See 'Special Varialbles' page from official documents.
    file: "{{ role_dir }}/{{ role_name }}/tasks/run_update/debian.yaml"
  when: ansible_os_family == "Debian"

- name: Include Rocky Linux-specific tasks if the OS family is RedHat
  ansible.builtin.include_tasks:
    file: "{{ role_dir }}/{{ role_name }}/tasks/run_update/redhat.yaml"
  when: ansible_os_family == "RedHat"
