---
# Following packages are required to use the keybind:
#   debian:
#     - nfs-kernel-server
#   redhat:
#     - nfs-utils
#
- name: Set nfs service name depending on OS family
  ansible.builtin.set_fact:
    nfs_service: "{{ nfs_service_name[ansible_os_family] }}"
- name: Ensure group exists with specific gid
  ansible.builtin.group:
    name: "{{ item.usergroup }}"
    gid: "{{ item.gid }}"
    state: present
  loop: "{{ export_table }}"
  loop_control:
    label: "{{ item.usergroup }}"
- name: Add {{ nfs_users }} to usergroup for accessing exported dir
  # Variable 'nfs_users' must be defined as list in playbook or host_vars, etc.
  ansible.builtin.user:
    name: "{{ item.0 }}"
    groups: "{{ item.1.usergroup }}"
    append: yes
    state: present
  loop: "{{ nfs_users | product(export_table) }}"
  loop_control:
    label: "User {{ item.0 }} to group {{ item.1.usergroup }}"
- name: Start nfs service
  ansible.builtin.service:
    name: "{{ nfs_service }}"
    state: restarted
- name: Configure directory for exporting
  ansible.builtin.file:
    path: "{{ item.exporting_dir }}"
    state: directory
    group: "{{ item.usergroup }}"
    mode: 'g+w,g+s'
  loop: "{{ export_table }}"
  loop_control:
    label: "{{ item.exporting_dir }}"
- name: Configure /etc/exports
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ item.0.exporting_dir }} \t {{ item.1.host }}({{ item.1.options | join(',') }})"
    regexp: "^{{ item.0.exporting_dir }}.*"
    state: present
    create: true
  loop: "{{ export_table | subelements('acl') }}"
  when: item.1.options is defined and item.1.options | length > 0
- name: Reexport all directories
  ansible.builtin.command: 'exportfs -r'
  changed_when: true
